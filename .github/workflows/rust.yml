name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Keep only the newest run for a given PR or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify locked dependency resolution
        run: cargo check --workspace --locked
      - uses: taiki-e/install-action@cargo-audit
      - name: Audit dependencies
        run: cargo audit
      - name: Format
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Test
        timeout-minutes: 30
        run: cargo test --workspace -- --nocapture
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz for the native runner
        run: cargo +nightly install cargo-fuzz --locked
      - name: Fuzz STUN decoder
        run: cargo +nightly fuzz run --fuzz-dir fuzz stun_decode -- -max_total_time=15 -timeout=2 -rss_limit_mb=2048
      - name: Fuzz handshake envelope decoder
        run: cargo +nightly fuzz run --fuzz-dir fuzz handshake_envelope -- -max_total_time=15 -timeout=2 -rss_limit_mb=2048
      - name: Fuzz TURN ChannelData decoder
        run: cargo +nightly fuzz run --fuzz-dir fuzz channel_data_decode -- -max_total_time=15 -timeout=2 -rss_limit_mb=2048
      - name: Fuzz sequenced datagram decoder
        run: cargo +nightly fuzz run --fuzz-dir fuzz sequenced_datagram_decode -- -max_total_time=15 -timeout=2 -rss_limit_mb=2048
      - name: Fuzz protected frame decoder
        run: cargo +nightly fuzz run --fuzz-dir fuzz secure_frame_decode -- -max_total_time=15 -timeout=2 -rss_limit_mb=2048

  network-namespace:
    name: Linux network namespace integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check network test script syntax
        run: bash -n tools/test-network-namespaces.sh
      - name: Install network test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables iputils-ping
      - name: Verify isolated forwarding, NAT and firewall
        run: sudo bash tools/test-network-namespaces.sh

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;36.0.0 ndk;27.3.13750724'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Android native transport
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 26 -o android/app/src/main/jniLibs build --release -p ghulakh-transport
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android JVM unit tests
        run: ./android/gradlew -p android testDebugUnitTest
      - name: Assemble debug APK
        run: ./android/gradlew -p android assembleDebug
      - name: Verify APK output
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ghulakh-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
