name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Keep only the newest run for a given PR or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.99.1 toolchain installer
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Verify locked dependency resolution
        run: cargo check --workspace --locked
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.23.0 --locked --force
      - name: Audit dependencies
        run: cargo audit
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        timeout-minutes: 30
        run: cargo test --workspace --locked -- --nocapture
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned toolchain installer
        with:
          toolchain: nightly-2026-11-12
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-11-12 install cargo-fuzz --version 0.13.2 --locked
      - name: Generate and verify fuzz workspace lockfile
        run: |
          cargo +nightly-2026-11-12 generate-lockfile --manifest-path fuzz/Cargo.toml
          cargo +nightly-2026-11-12 check --manifest-path fuzz/Cargo.toml --locked
      - name: Commit generated fuzz lockfile to the PR branch
        if: github.event_name == 'pull_request'
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git fetch origin "$PR_BRANCH"
          git checkout -B "$PR_BRANCH" FETCH_HEAD
          git add fuzz/Cargo.lock
          if git diff --cached --quiet; then
            echo "Fuzz lockfile is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: lock fuzz workspace dependencies"
          git push origin "HEAD:$PR_BRANCH"
      - name: Fuzz STUN decoder
        run: cargo +nightly-2026-11-12 fuzz run --fuzz-dir fuzz stun_decode -- -max_total_time=15 -timeout=2 -rss_limit_mb=2048
      - name: Fuzz handshake envelope decoder
        run: cargo +nightly-2026-11-12 fuzz run --fuzz-dir fuzz handshake_envelope -- -max_total_time=15 -timeout=2 -rss_limit_mb=2048
      - name: Fuzz TURN ChannelData decoder
        run: cargo +nightly-2026-11-12 fuzz run --fuzz-dir fuzz channel_data_decode -- -max_total_time=15 -timeout=2 -rss_limit_mb=2048
      - name: Fuzz sequenced datagram decoder
        run: cargo +nightly-2026-11-12 fuzz run --fuzz-dir fuzz sequenced_datagram_decode -- -max_total_time=15 -timeout=2 -rss_limit_mb=2048
      - name: Fuzz protected frame decoder
        run: cargo +nightly-2026-11-12 fuzz run --fuzz-dir fuzz secure_frame_decode -- -max_total_time=15 -timeout=2 -rss_limit_mb=2048

  network-namespace:
    name: Linux network namespace integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check network test script syntax
        run: bash -n tools/test-network-namespaces.sh
      - name: Install network test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 nftables iputils-ping
      - name: Verify isolated forwarding, NAT and firewall
        run: sudo bash tools/test-network-namespaces.sh

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platforms;android-35 build-tools;36.0.0 ndk;27.3.13750724'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.99.1 toolchain installer
        with:
          toolchain: 1.100.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build Android native transport
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 26 -o android/app/src/main/jniLibs build --release -p ghulakh-transport
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3
      - name: Run Android JVM unit tests with strict dependency verification
        run: ./android/gradlew -p android --dependency-verification=strict testDebugUnitTest
      - name: Assemble debug APK with strict dependency verification and locking
        run: ./android/gradlew -p android --dependency-verification=strict assembleDebug
      - name: Verify dependency controls were not modified
        run: git diff --exit-code -- android/app/gradle.lockfile android/gradle/verification-metadata.xml
      - name: Verify APK output
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Android debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghulakh-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
