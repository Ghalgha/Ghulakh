[package]
name = "ghulakh-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
bytes = "1"
hex = "0.4"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
quinn-proto = { version = "=0.11.19", default-features = false }
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde_json = "1"
sha2 = "0.10"
subtle = "2"
ghulakh-protocol = { path = "../crates/protocol" }
tokio = { version = "1", features = ["full"] }
tun-rs = { version = "2.8.18", default-features = false, features = ["async"] }

[dev-dependencies]
ghulakh-transport = { path = "../crates/transport" }
rcgen = "0.13"
tempfile = "3"
