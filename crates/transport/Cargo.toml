[package]
name = "ghulakh-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[dependencies]
anyhow = "1"
ghulakh-protocol = { path = "../protocol" }
jni = "0.21"
md-5 = "0.10"
rand = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
zeroize = "1"
